# OpenSpec Config — SGVO

schema: spec-driven

context: |
  Tech stack: .NET 10, EF Core 9, Pomelo MySQL, Clean Architecture
  Architecture: Domain / Application / Infrastructure / Api / Shared
  Testing: xUnit v2.9.3, FluentAssertions, Moq, InMemory EF
  Database: MySQL 9.6.0 (socket /tmp/mysql.sock), migrations in sql/
  Conventions: Spanish naming (PascalCase), soft delete via Activo

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns in src/SGVO.*/
    tdd: false
    test_command: dotnet test
  verify:
    test_command: dotnet test --collect:"XPlat Code Coverage"
    build_command: dotnet build --no-restore
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

# Testing Capabilities (auto-generated by sdd-init)
testing:
  framework: xunit
  version: "2.9.3"
  strict_tdd: false
  test_command: dotnet test
  coverage_command: dotnet test --collect:"XPlat Code Coverage"
  unit_available: true
  integration_available: true
  e2e_available: false
  layers:
    unit:
      available: true
      tools: [xUnit, Moq, FluentAssertions, EF InMemory]
    integration:
      available: true
      tools: [Microsoft.AspNetCore.Mvc.Testing, WebApplicationFactory]
    e2e:
      available: false
      tools: []